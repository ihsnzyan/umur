<script> 
    function sending() {
        let hasil = document.getElementById("hasil");
        let nama = document.getElementById("nama").value;
        let usia = document.getElementById("usia").value;
        const namaValid = /^[A-Za-z\s]+$/.test(nama);

        if (nama == "" || !namaValid){
            hasil.innerText = "MASUKKAN NAMA DENGAN BENAR";
            hasil.style.color = "red";
        }
        else if  (usia == "") {hasil.innerText = "USIANYA BELUM DIMASUKKAN"; hasil.style.color = "red";}
        else if  (usia < 0) {hasil.innerText = "GAADA USIA MINUS KOCAK"; hasil.style.color = "red";}
        else if  (usia > 50) {hasil.innerText = "BJIR UDAH TUA"; hasil.style.color = "black";}
        else if  (usia < 12) {hasil.innerText = "BOCIL";  hasil.style.color = "black";}
        else {
            hasil.innerText = "Nama Anda " + usia + " dan Anda berumur " + nama;  hasil.style.color = "black";
        }}
</script>
